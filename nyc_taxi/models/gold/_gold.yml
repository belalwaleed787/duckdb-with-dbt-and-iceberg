version: 2

models:
  - name: dim_date
    description: Calendar days for every year that has trips.
    columns:
      - name: date_key
        description: yyyymmdd
        data_tests: [unique, not_null]

  - name: dim_time_of_day
    description: Hours of the day with a day-part label.
    columns:
      - name: hour_of_day
        data_tests: [unique, not_null]

  - name: dim_location
    description: NYC TLC taxi zones.
    columns:
      - name: location_id
        data_tests: [unique, not_null]

  - name: dim_vendor
    columns:
      - name: vendor_id
        data_tests: [unique, not_null]

  - name: dim_rate_code
    columns:
      - name: rate_code_id
        data_tests: [unique, not_null]

  - name: dim_payment_type
    columns:
      - name: payment_type_id
        data_tests: [unique, not_null]

  - name: fact_trips
    description: One row per valid trip (grain = trip). Partitioned by pickup month.
    columns:
      - name: trip_id
        data_tests: [unique, not_null]
      - name: pickup_date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: dropoff_date_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: pickup_hour_of_day
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_time_of_day')
                field: hour_of_day
      - name: pickup_location_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_location')
                field: location_id
      - name: dropoff_location_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_location')
                field: location_id
      - name: vendor_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_vendor')
                field: vendor_id
      - name: rate_code_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_rate_code')
                field: rate_code_id
      - name: payment_type_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_payment_type')
                field: payment_type_id

  - name: fact_daily_zone_summary
    description: Trips, distance and revenue per pickup day and pickup zone.
    columns:
      - name: date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: location_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_location')
                field: location_id
